<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="100" cy="100" r="98" fill="#1a1330"/>

  <!-- brain body: lobes made of bumps -->
  <g fill="#f6a6c1" stroke="#c96f95" stroke-width="3">
    <path d="M55 95
             Q40 70 60 55
             Q65 35 90 40
             Q100 25 115 40
             Q140 35 145 60
             Q165 70 150 95
             Q165 115 145 130
             Q140 155 115 150
             Q100 165 85 150
             Q60 155 55 130
             Q35 115 55 95 Z"/>
  </g>

  <!-- wrinkle lines -->
  <g stroke="#c96f95" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M75 60 Q85 70 75 82"/>
    <path d="M100 50 Q110 62 100 76"/>
    <path d="M125 58 Q135 68 124 80"/>
    <path d="M65 105 Q80 100 90 112"/>
    <path d="M110 108 Q125 100 138 112"/>
    <path d="M85 128 Q100 120 115 130"/>
  </g>

  <!-- center divide -->
  <path d="M100 45 Q95 90 100 155" stroke="#c96f95" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/>

  <!-- tiny goggles -->
  <circle cx="80" cy="95" r="14" fill="#0e1024" stroke="#2CB1BC" stroke-width="4"/>
  <circle cx="118" cy="95" r="14" fill="#0e1024" stroke="#2CB1BC" stroke-width="4"/>
  <rect x="92" y="91" width="10" height="6" rx="2" fill="#2CB1BC"/>
  <circle cx="80" cy="95" r="6" fill="#8be9f2"/>
  <circle cx="118" cy="95" r="6" fill="#8be9f2"/>
  <circle cx="83" cy="92" r="2" fill="#fff"/>
  <circle cx="121" cy="92" r="2" fill="#fff"/>

  <!-- blush -->
  <ellipse cx="70" cy="120" rx="7" ry="4" fill="#ff7aa0" opacity="0.7"/>
  <ellipse cx="128" cy="120" rx="7" ry="4" fill="#ff7aa0" opacity="0.7"/>

  <!-- smile -->
  <path d="M88 122 Q100 132 112 122" stroke="#8a3b57" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- little spark above head -->
  <g stroke="#6A3FD9" stroke-width="3" stroke-linecap="round">
    <path d="M100 20 L100 10"/>
    <path d="M92 25 L85 18"/>
    <path d="M108 25 L115 18"/>
  </g>
</svg>

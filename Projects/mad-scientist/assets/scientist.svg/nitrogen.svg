<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="100" cy="100" r="98" fill="#1a1330"/>

  <!-- steam curls -->
  <g stroke="#bff2f2" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M85 40 Q75 25 85 12 Q95 2 88 -8"/>
    <path d="M115 40 Q125 25 115 12 Q105 2 112 -8"/>
    <path d="M100 35 Q95 18 100 5"/>
  </g>

  <!-- tank body -->
  <rect x="65" y="55" width="70" height="110" rx="18" fill="#8be9f2" stroke="#2CB1BC" stroke-width="4"/>
  <rect x="65" y="55" width="70" height="30" rx="18" fill="#c8f6f6"/>
  <rect x="80" y="40" width="40" height="20" rx="6" fill="#2CB1BC"/>

  <!-- frost sparkles -->
  <g fill="#ffffff">
    <path d="M50 90 l3 8 l8 3 l-8 3 l-3 8 l-3-8 l-8-3 l8-3 Z"/>
    <path d="M155 120 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5-6 l-6-2.5 l6-2.5 Z"/>
  </g>

  <!-- eyes -->
  <circle cx="85" cy="110" r="11" fill="#0e1024"/>
  <circle cx="115" cy="110" r="11" fill="#0e1024"/>
  <circle cx="88" cy="106" r="3.5" fill="#ffffff"/>
  <circle cx="118" cy="106" r="3.5" fill="#ffffff"/>

  <!-- blush -->
  <ellipse cx="76" cy="124" rx="7" ry="4" fill="#a8e8ff" opacity="0.8"/>
  <ellipse cx="124" cy="124" rx="7" ry="4" fill="#a8e8ff" opacity="0.8"/>

  <!-- smile -->
  <path d="M92 128 Q100 135 108 128" stroke="#166b73" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- little warning label -->
  <rect x="80" y="140" width="40" height="16" rx="4" fill="#fff3e0"/>
  <text x="100" y="152" font-size="11" text-anchor="middle" fill="#8a1f1f" font-family="monospace">-196°</text>
</svg>

<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="100" cy="100" r="98" fill="#1a1330"/>

  <!-- wedge -->
  <path d="M40 150 L100 40 L165 150 Q100 175 40 150 Z" fill="#ffce54" stroke="#e0a92e" stroke-width="3"/>
  <path d="M40 150 L165 150 Q100 175 40 150 Z" fill="#ffdd7a"/>

  <!-- holes -->
  <circle cx="90" cy="90" r="9" fill="#e0a92e" opacity="0.55"/>
  <circle cx="120" cy="110" r="7" fill="#e0a92e" opacity="0.55"/>
  <circle cx="75" cy="120" r="6" fill="#e0a92e" opacity="0.55"/>
  <circle cx="130" cy="80" r="5" fill="#e0a92e" opacity="0.5"/>

  <!-- eyes -->
  <circle cx="82" cy="128" r="10" fill="#0e1024"/>
  <circle cx="118" cy="128" r="10" fill="#0e1024"/>
  <circle cx="85" cy="124" r="3.5" fill="#ffffff"/>
  <circle cx="121" cy="124" r="3.5" fill="#ffffff"/>

  <!-- blush -->
  <ellipse cx="72" cy="142" rx="7" ry="4" fill="#ff9ab0" opacity="0.7"/>
  <ellipse cx="128" cy="142" rx="7" ry="4" fill="#ff9ab0" opacity="0.7"/>

  <!-- smile -->
  <path d="M90 145 Q100 154 110 145" stroke="#a5731a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- tiny goggles resting on top -->
  <g transform="translate(0,-4)">
    <circle cx="80" cy="55" r="10" fill="#0e1024" stroke="#2CB1BC" stroke-width="3"/>
    <circle cx="112" cy="50" r="10" fill="#0e1024" stroke="#2CB1BC" stroke-width="3"/>
    <rect x="88" y="47" width="10" height="5" rx="2" fill="#2CB1BC"/>
  </g>
</svg>
